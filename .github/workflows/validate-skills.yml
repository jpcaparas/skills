name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set Up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Set Up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Set Up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.4"

      # Skill scripts under test shell out to `rg`.
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install Python Validation Packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-validation.txt

      - name: Install Pinned Chromium
        shell: bash
        # Playwright's pinned package selects the revision, so both runners test
        # the same browser instead of whatever Chrome the runner image ships.
        run: python3 -m playwright install chromium --no-shell --with-deps

      - name: Install Locked Node Validation Packages
        shell: bash
        run: scripts/run-pnpm.sh install --frozen-lockfile

      - name: Print Validation Tool Versions
        shell: bash
        run: |
          python3 --version
          node --version
          npm --version
          bun --version
          rg --version | head -n 1

      - name: Validate Skills
        shell: bash
        run: bash scripts/validate-all-skills.sh
