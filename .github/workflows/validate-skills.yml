name: Validate Skills

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install Validation Tools (Linux)
        if: runner.os == 'Linux'
        # Required by skill probe suites that shell out to external CLIs:
        # - skills/ripgrep/scripts/probe_ripgrep.py -> `rg --version`
        # - skills/httpie/scripts/probe_httpie.py -> `http`, `https`, `httpie`
        run: sudo apt-get update && sudo apt-get install -y ripgrep httpie

      - name: Install Validation Tools (macOS)
        if: runner.os == 'macOS'
        # Keep macOS validation equivalent to Linux; the skill probes expect
        # these executable names, not just Python or Node package APIs.
        run: brew install ripgrep httpie

      - name: Install Python Validation Packages
        # Required by the travel spreadsheet workbook smoke test.
        run: python -m pip install --upgrade pip openpyxl

      - name: Print Validation Tool Versions
        shell: bash
        run: |
          python --version
          node --version
          npm --version
          bun --version
          rg --version | head -n 1
          http --version

      - name: Validate Skills
        shell: bash
        # CI validation is driven by the repository scripts directly; it does
        # not depend on node_modules, so skip pnpm install and run the shared
        # validator entrypoint that local validation uses too.
        run: bash scripts/validate-all-skills.sh
