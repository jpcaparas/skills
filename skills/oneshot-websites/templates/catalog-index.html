<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{CATALOG_TITLE}}</title>
  <meta name="description" content="{{CATALOG_DESCRIPTION}}">
  <style>
    :root {
      --bg: #f8faf8;
      --surface: #ffffff;
      --ink: #17302c;
      --muted: #52645f;
      --line: rgba(23, 48, 44, 0.14);
      --accent: #0f766e;
      --accent-soft: #d9f4ef;
      --progress: #92400e;
      --progress-soft: #fef3c7;
      --error: #9f1239;
      --error-soft: #fde7ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      color: var(--ink);
      background: var(--bg);
    }
    main { max-width: 1240px; margin: 0 auto; padding: 32px 20px 56px; }
    .hero { padding: 12px 0 28px; border-bottom: 1px solid var(--line); }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--muted);
    }
    h1 { margin: 0; max-width: 24ch; font-size: clamp(32px, 5vw, 52px); font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
    .sub { max-width: 52rem; margin: 14px 0 0; color: var(--muted); line-height: 1.55; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; color: var(--muted); }
    .meta span {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
    }
    code {
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
    .fairness {
      margin-top: 18px;
      padding: 18px 20px;
      border-left: 3px solid var(--accent);
      background: #edf7f4;
    }
    .fairness h2 { margin: 0; font-size: 16px; }
    .fairness p { margin: 10px 0 0; color: var(--muted); line-height: 1.55; }
    .table-scroll { margin: 24px -20px -2px; overflow-x: auto; white-space: nowrap; }
    .table-inner { display: inline-block; min-width: 100%; padding: 2px 20px; vertical-align: middle; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 14px; font-weight: 700; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    a { color: var(--ink); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    caption {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .status { display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 14px; font-weight: 700; }
    .status-ok { color: var(--accent); background: var(--accent-soft); }
    .status-progress { color: var(--progress); background: var(--progress-soft); }
    .status-problem { color: var(--error); background: var(--error-soft); }
    .identity { white-space: pre-wrap; tab-size: 2; }
    .muted { color: var(--muted); }
    .footer-note { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); }
    @media (max-width: 880px) {
      main { padding: 24px 16px 40px; }
      .hero { padding-top: 8px; }
      .table-scroll { margin-right: -16px; margin-left: -16px; }
      .table-inner { padding-right: 16px; padding-left: 16px; }
      th, td { padding: 14px 12px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">One-shot experiments</p>
      <h1>{{CATALOG_TITLE}}</h1>
      <p class="sub">{{CATALOG_DESCRIPTION}}</p>
      <div class="meta">{{META_CHIPS}}</div>
      <section class="fairness">
        <h2>Provenance note</h2>
        <p>{{FAIRNESS_NOTE}}</p>
      </section>
    </section>
    <div class="table-scroll">
      <div class="table-inner">
        <table>
          <caption>One-shot experiment provenance and artifact links</caption>
          <thead>
            <tr>
              <th scope="col">Model</th>
              <th scope="col">Harness</th>
              <th scope="col">Experiment</th>
              <th scope="col">Run</th>
              <th scope="col">Status</th>
              <th scope="col">Classification</th>
              <th scope="col">Workers</th>
              <th scope="col">Summary or blocker</th>
              <th scope="col">Artifact</th>
              <th scope="col">Prompt</th>
            </tr>
          </thead>
          <tbody>
            {{ROWS}}
          </tbody>
        </table>
      </div>
    </div>
    <footer class="footer-note">{{FOOTER_NOTE}}</footer>
  </main>
</body>
</html>
